<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruta RideSafe IA</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Barlow',Arial,sans-serif;background:#0a0f1e;color:#e8ecf3;height:100vh;overflow:hidden}
    #mapa{width:100%;height:100vh;position:absolute;top:0;left:0}
    #panel{
      position:absolute;left:0;right:0;bottom:0;z-index:900;
      background:#0d1526;border-top:1px solid #1f2a45;
      padding:16px 18px 20px;border-radius:20px 20px 0 0;
      box-shadow:0 -8px 30px rgba(0,0,0,.4);
    }
    .nombre{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:#fff;margin-bottom:2px}
    .fecha{font-size:12px;color:#7d8aa3;margin-bottom:14px}
    .stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px}
    .stat b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:#a8e63d;line-height:1}
    .stat span{display:block;font-size:9px;color:#7d8aa3;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
    .cta{
      display:flex;align-items:center;justify-content:center;gap:6px;
      background:#a8e63d;color:#0a0f1e;font-weight:800;font-size:13px;
      padding:12px;border-radius:12px;text-decoration:none;margin-top:4px;
    }
    .brand{position:absolute;top:14px;left:14px;z-index:999;display:flex;align-items:center;gap:6px;
      background:rgba(10,15,30,.75);backdrop-filter:blur(4px);padding:6px 12px;border-radius:20px;
      font-size:12px;font-weight:800;color:#a8e63d;border:1px solid rgba(168,230,61,.3)}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0f1e;color:#7d8aa3;font-size:14px;z-index:2000}
  </style>
</head>
<body>
<div id="loading">Cargando ruta…</div>
<div id="mapa"></div>
<div class="brand">🛡️ RIDESAFE IA</div>
<div id="panel" style="display:none">
  <div class="nombre" id="p-nombre">Ciclista</div>
  <div class="fecha" id="p-fecha"></div>
  <div class="stats">
    <div class="stat"><b id="p-km">--</b><span>km</span></div>
    <div class="stat"><b id="p-tiempo">--</b><span>tiempo</span></div>
    <div class="stat"><b id="p-vel">--</b><span>km/h</span></div>
    <div class="stat"><b id="p-desnivel">--</b><span>m desnivel</span></div>
  </div>
  <a class="cta" href="https://app.ridesafeia.es" target="_blank" rel="noopener">🚴 Descubre RideSafe IA</a>
</div>

<script>
function obtenerIdURL(){
  var params = new URLSearchParams(window.location.search);
  return params.get('id');
}

function formatoTiempo(seg){
  var m = Math.floor(seg/60), s = String(seg%60).padStart(2,'0');
  return m+':'+s;
}

function pintarRuta(datos){
  document.getElementById('loading').style.display = 'none';
  document.getElementById('panel').style.display = 'block';

  document.getElementById('p-nombre').textContent = datos.nombre || 'Ciclista';
  var fecha = datos.fecha ? new Date(datos.fecha).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}) : '';
  document.getElementById('p-fecha').textContent = fecha.charAt(0).toUpperCase()+fecha.slice(1);
  document.getElementById('p-km').textContent = (datos.distancia/1000).toFixed(1);
  document.getElementById('p-tiempo').textContent = formatoTiempo(datos.duracion||0);
  var vel = datos.duracion>0 ? ((datos.distancia/1000)/(datos.duracion/3600)).toFixed(1) : '0';
  document.getElementById('p-vel').textContent = vel;
  document.getElementById('p-desnivel').textContent = Math.round(datos.desnivel||0);

  var mapa = L.map('mapa', {zoomControl:true});
  L.tileLayer('https://api.mapbox.com/styles/v1/mapbox/outdoors-v12/tiles/256/{z}/{x}/{y}{r}?access_token=pk.eyJ1Ijoiam1wZWxsZWlkYSIsImEiOiJjbXR6b3c3cWkwYnBiMnlyMXFxZGw2ZWw0In0.45Z-ttQ0sbTc2K0crw6wZg', {
    maxZoom:20, attribution:'© Mapbox, © OpenStreetMap'
  }).addTo(mapa);

  var pts = datos.points || [];
  if (pts.length >= 2) {
    var latlngs = pts.map(function(p){ return [p[0], p[1]]; });
    var linea = L.polyline(latlngs, {color:'#a8e63d', weight:5, opacity:.95}).addTo(mapa);
    L.circleMarker(latlngs[0], {radius:7, color:'#fff', weight:2, fillColor:'#22c55e', fillOpacity:1}).addTo(mapa);
    L.circleMarker(latlngs[latlngs.length-1], {radius:7, color:'#fff', weight:2, fillColor:'#ff3355', fillOpacity:1}).addTo(mapa);
    mapa.fitBounds(linea.getBounds(), {padding:[30,30]});
  } else {
    mapa.setView([41.6175,-0.6298], 12);
  }
  setTimeout(function(){ mapa.invalidateSize(); }, 200);
}

function inicializarFirebase(cb){
  if (typeof firebase === 'undefined') { setTimeout(function(){inicializarFirebase(cb);}, 300); return; }
  var firebaseConfig = {
    apiKey: 'AIzaSyDlaR4dgVtBMa4B4aY6l10_O4xBNgJvNJQ',
    authDomain: 'ridesafe-app-25ecb.firebaseapp.com',
    databaseURL: 'https://ridesafe-app-25ecb-default-rtdb.europe-west1.firebasedatabase.app',
    projectId: 'ridesafe-app-25ecb',
    storageBucket: 'ridesafe-app-25ecb.firebasestorage.app',
    messagingSenderId: '322135466974',
    appId: '1:322135466974:web:28b4586375bfd6211bf34f'
  };
  if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(firebaseConfig);
  cb(firebase.database());
}

document.addEventListener('DOMContentLoaded', function(){
  var id = obtenerIdURL();
  if (!id) {
    document.getElementById('loading').textContent = '❌ Enlace no válido';
    return;
  }
  inicializarFirebase(function(db){
    db.ref('rutas_publicas/' + id).once('value').then(function(snap){
      var datos = snap.val();
      if (!datos) {
        document.getElementById('loading').textContent = '❌ Esta ruta ya no está disponible';
        return;
      }
      pintarRuta(datos);
    }).catch(function(){
      document.getElementById('loading').textContent = '❌ No se pudo cargar la ruta';
    });
  });
});
</script>
</body>
</html>
