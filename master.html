<style>
:root{
  --bg:#070D17;--bg2:#0B1422;--panel:#0E1A2B;--card:#122238;--card2:#16294A;--line:#1F3350;--line2:#2A4468;
  --txt:#EEF3F8;--txt2:#A7B4C6;--txt3:#6F8199;--lime:#C8DC3C;--lime2:#A9BD2E;--on-lime:#0E1A2B;--blue:#60A5FA;
  --ok:#4ADE80;--warn:#FBBF24;--bad:#F87171;--r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--txt);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 600px at 85% -10%,rgba(200,220,60,.07),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(96,165,250,.06),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--lime)}
.num{font-variant-numeric:tabular-nums}
/* Acceso */
#gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gbox{width:100%;max-width:420px;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:28px;padding:34px 28px;text-align:center;position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.gbox .bike{position:absolute;right:-60px;top:-40px;width:260px;opacity:.07}
.gbox img{width:78px;height:78px;border-radius:20px;margin-bottom:14px}
.gbox h1{font-size:26px;font-weight:800;letter-spacing:-.01em}.gbox h1 span{color:var(--lime)}
.gbox .tag{display:inline-block;margin:8px 0 18px;font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--lime);border:1px solid rgba(200,220,60,.35);border-radius:20px;padding:4px 12px}
.gbox p{color:var(--txt2);font-size:14.5px;line-height:1.5;margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:23px;border:1px solid var(--line2);background:var(--card);font-weight:700;font-size:14.5px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--card2);border-color:var(--txt3)}
.btn.lime{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}.btn.lime:hover{background:#D6E85A}
.btn.red{color:var(--bad);border-color:rgba(248,113,113,.45)}.btn.red:hover{background:rgba(248,113,113,.1)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:17px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
/* Estructura */
#app{display:none;min-height:100vh}
.side{position:fixed;left:0;top:0;bottom:0;width:236px;background:rgba(9,17,29,.92);backdrop-filter:blur(10px);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;z-index:5}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand img{width:40px;height:40px;border-radius:11px}
.brand b{font-size:17px;font-weight:800;display:block;line-height:1.1}.brand b span{color:var(--lime)}
.brand small{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--lime)}
.nav{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;border:0;background:none;color:var(--txt2);font-weight:700;font-size:14.5px;text-align:left;width:100%}
.nav:hover{background:var(--card);color:var(--txt)}
.nav.on{background:rgba(200,220,60,.12);color:var(--lime)}
.nav .ct{margin-left:auto;font-size:11.5px;background:var(--card2);color:var(--txt2);border-radius:10px;padding:1px 8px}
.nav .ct.alert{background:rgba(248,113,113,.18);color:var(--bad)}
.side .me{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;font-size:12.5px;color:var(--txt3)}
.side .me b{display:block;color:var(--txt2);font-size:13px;word-break:break-all}
main{margin-left:236px;padding:26px 30px 60px;max-width:1320px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h2{font-size:25px;font-weight:800;letter-spacing:-.01em}
.top .sub{color:var(--txt3);font-size:13px}
.top .sp{flex:1}
/* Tarjetas */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi .l{color:var(--txt2);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:32px;font-weight:800;margin-top:6px;letter-spacing:-.02em}
.kpi .h{color:var(--txt3);font-size:12px;margin-top:2px}
.kpi.alert{border-color:rgba(248,113,113,.45)}.kpi.alert .v{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;min-width:0}
.box h3{font-size:16px;font-weight:800;margin-bottom:4px}
.box .d{color:var(--txt3);font-size:12.5px;margin-bottom:12px}
/* Tablas */
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line2);border-radius:23px;padding:11px 16px;outline:none}
.search:focus,.inp:focus{border-color:var(--lime)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:17px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--txt2)}
.chip.on{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}
select.inp,.inp{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:10px 12px;outline:none}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.tbl th{text-align:left;color:var(--txt3);font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.tw{overflow-x:auto}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#0E1A2B;flex-shrink:0}
.logo{width:34px;height:34px;border-radius:9px;object-fit:cover;background:#fff;flex-shrink:0}
.who b{display:block;font-weight:700}.who small{color:var(--txt3);font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:800;border-radius:10px;padding:2px 8px;white-space:nowrap}
.pill.lime{background:rgba(200,220,60,.15);color:var(--lime)}.pill.ok{background:rgba(74,222,128,.14);color:var(--ok)}
.pill.bad{background:rgba(248,113,113,.15);color:var(--bad)}.pill.mut{background:var(--card2);color:var(--txt2)}.pill.warn{background:rgba(251,191,36,.15);color:var(--warn)}
.empty{color:var(--txt3);text-align:center;padding:26px 10px;font-size:14px}
/* Gráficas */
.chart{position:relative;height:200px;margin-top:6px}
.chart svg{width:100%;height:100%;display:block;overflow:visible}
.tip{position:fixed;pointer-events:none;background:#0A1320;border:1px solid var(--line2);border-radius:10px;padding:7px 10px;font-size:12.5px;z-index:50;display:none;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.tip b{font-size:15px}
.rank{display:flex;flex-direction:column;gap:8px}
.rank .row{display:flex;align-items:center;gap:10px}
.rank .row .bw{flex:1;height:8px;background:var(--card2);border-radius:4px;overflow:hidden}
.rank .row .bw i{display:block;height:100%;background:var(--lime);border-radius:4px}
.rank .row .n{width:40%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:13.5px}
.rank .row .c{width:44px;text-align:right;color:var(--txt2);font-size:13px}
/* Ventanas */
.ov{position:fixed;inset:0;background:rgba(3,7,13,.72);backdrop-filter:blur(4px);z-index:40;display:none;align-items:center;justify-content:center;padding:18px}
.ov.show{display:flex}
.dlg{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:24px;padding:22px}
.dlg h3{font-size:19px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.dlg h3 .x{margin-left:auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--card)}
.dlg p{color:var(--txt2);font-size:14px;line-height:1.5;margin-bottom:12px}
.dlg .row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line2);border-radius:14px;margin-bottom:8px;background:var(--card);width:100%;text-align:left;font-weight:600}
.opt:hover{border-color:var(--lime)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--lime);color:var(--on-lime);font-weight:800;border-radius:22px;padding:11px 18px;opacity:0;transition:.25s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.prog{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;width:0;background:var(--lime);transition:width .2s}
.list li{margin:0 0 6px 18px;color:var(--txt2);font-size:14px;line-height:1.45}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}.kv span{color:var(--txt3)}
@media (max-width:980px){
  .side{position:sticky;top:0;bottom:auto;width:auto;height:auto;flex-direction:row;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);gap:6px;align-items:center}
  .brand{padding:0 8px 0 0;flex-shrink:0}.brand div{display:none}
  .nav{width:auto;white-space:nowrap;padding:9px 12px;flex-shrink:0}.nav .ct{display:none}
  .side .me{display:none}
  main{margin-left:0;padding:18px 16px 60px}
  .kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}
  .kpi .v{font-size:26px}
  .tbl .hide-m{display:none}
}
</style></head><body>

<div id="gate"><div class="gbox">
  <svg class="bike" viewBox="0 0 24 24" fill="none" stroke="#C8DC3C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17" r="3.5"/><circle cx="18.5" cy="17" r="3.5"/><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V14l-3-3 4-3 2 3h3"/></svg>
  <img src="icons/icon-512.png" alt="RideSafe IA">

</div></div>

<!-- ===== Consola ===== -->
<div id="app">
  <nav class="side" id="side">
    <div class="brand"><img src="icons/icon-192.png" alt=""><div><b>RideSafe <span>IA</span></b><small>MASTER</small></div></div>

  <main>

      <button class="btn sm" onclick="loadAll(true)">🔄 Actualizar</button><a class="btn sm" href="./" target="_blank" rel="noopener" style="text-decoration:none">📱 Abrir la app</a></div>

<script>
/* ===================================================================
   RideSafe IA — Consola Master (solo el creador y desarrollador)
   La seguridad real la ponen las reglas de Firebase: solo la cuenta del
   propietario puede leer y escribir estos datos. Esta página no guarda
   ninguna clave privada ni el correo del propietario.
   =================================================================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jsq=s=>esc(JSON.stringify(String(s??'')));
const SAFE_IMG=/^data:image\/(png|jpe?g|webp);base64,[A-Za-z0-9+/=]+$/;
const COLORS=['#C8DC3C','#60A5FA','#F59E0B','#34D399','#F472B6','#A78BFA','#FB7185','#22D3EE'];
const colorOf=n=>{let h=0;for(const c of String(n||''))h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]};
const ini=n=>String(n||'?').trim().charAt(0).toUpperCase()||'?';
const tsMs=v=>v&&typeof v.toMillis==='function'?v.toMillis():typeof v==='number'?v:(v&&v.seconds?v.seconds*1000:0);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const fDate=v=>{const t=typeof v==='string'?new Date(v+'T12:00'):new Date(tsMs(v));return isNaN(t)||!tsMs(v)&&typeof v!=='string'?'—':t.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})};
const nf=n=>Number(n||0).toLocaleString('es-ES');
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}

firebase.initializeApp({apiKey:"AIzaSyBlPVwuYKu3u6LS0AB4Fji9sy2poAxsTZE",authDomain:"velogo-fba42.firebaseapp.com",projectId:"velogo-fba42",storageBucket:"velogo-fba42.firebasestorage.app",messagingSenderId:"675190202425",appId:"1:675190202425:web:2040bd6db96829c8242de8"});
const auth=firebase.auth(),db=firebase.firestore(),FV=firebase.firestore.FieldValue,TS=firebase.firestore.Timestamp;

/* ---------- Acceso: Google + comprobación en el servidor ---------- */
function gate(msg,showIn,showOut){$('gate').style.display='grid';$('app').style.display='none';$('gMsg').innerHTML=msg;$('gBtn').style.display=showIn?'flex':'none';$('gOut').style.display=showOut?'flex':'none'}
function signIn(){const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});auth.signInWithPopup(p).catch(e=>{if(/popup/.test(e.code||''))auth.signInWithRedirect(p);else gate('No se pudo entrar: '+esc(e.code||e.message),true,false)})}
function signOut(){auth.signOut().then(()=>gate('Sesión cerrada.',true,false))}
auth.getRedirectResult().catch(()=>{});
auth.onAuthStateChanged(async u=>{
  if(!u||u.isAnonymous){gate('Acceso exclusivo del creador y desarrollador de la app.<br>Entra con tu cuenta de Google.',true,false);return}
  gate('Comprobando permisos…',false,false);
  try{await db.collection('reports').limit(1).get();}      // solo el propietario puede leer los reportes (reglas de Firebase)
  catch(e){gate('🔒 <b>Acceso restringido.</b><br>Esta cuenta no es la del propietario de RideSafe IA.',false,true);return}
  $('gate').style.display='none';$('app').style.display='block';$('meMail').textContent=(e=>{const i=e.indexOf('@');return i>0?e.slice(0,2)+'•••'+e.slice(i):''})(u.email||'');
  loadAll();
});

/* ---------- Datos ---------- */
let D={users:[],groups:[],rides:[],feed:[],routes:[],pois:[],reports:[],nearby:[],rank:[],mod:[],sanctions:[],support:[]},ann={},upd={items:[]},loadedAt=0,view='res';
const COLS=['users','groups','rides','feed','routes','pois','reports','nearby','rank','mod','sanctions','support'];
async function loadAll(manual){
  $('view').innerHTML='<div class="empty">Cargando datos de la app…</div>';
  const res=await Promise.all(COLS.map(c=>db.collection(c).limit(5000).get().then(s=>s.docs.map(d=>({id:d.id,...d.data()}))).catch(e=>{console.warn(c,e);return[]})));
  COLS.forEach((c,i)=>D[c]=res[i]);
  try{const s=await db.collection('config').doc('announce').get();ann=s.exists?s.data():{}}catch(e){ann={}}
  try{const s=await db.collection('config').doc('updates').get();upd=s.exists?s.data():{items:[]};upd.items=upd.items||[]}catch(e){upd={items:[]}}
  loadedAt=Date.now();counts();render();if(manual)toast('Datos actualizados');
}
const clubName=c=>{const g=D.groups.find(x=>x.id===c);return g?g.name:(c?c:'Sin club')};
const userClub=uid=>{const g=D.groups.find(x=>(x.members||{})[uid]);return g||null};
function counts(){
  $('nClubs').textContent=D.groups.length;$('nUsers').textContent=D.users.filter(u=>u.name).length;
  $('nRides').textContent=D.rides.filter(r=>r.date>=iso(Date.now())).length;
  const nr=$('nRep');nr.textContent=D.reports.length||'';nr.classList.toggle('alert',D.reports.length>0);
  const na=activeSan();$('nSan').textContent=na.length||'';
  const ns=D.support.filter(x=>!x.reply&&x.status!=='closed').length;const nsu=$('nSup');if(nsu){nsu.textContent=ns||'';nsu.classList.toggle('alert',ns>0)}
}
function go(v){view=v;$('tip').style.display='none';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.v===v));render();window.scrollTo(0,0)}
function render(){
  const T={res:['Resumen','Todo RideSafe IA de un vistazo'],clubs:['Clubes','Cada club es un espacio privado'],users:['Ciclistas','Todos los usuarios de la app'],rides:['Salidas','Todas las salidas de todos los clubes'],cont:['Contenido','Rutas, actividad y puntos ciclistas'],rep:['Reportes','Lo que denuncian los usuarios'],sup:['Consultas e incidencias','Lo que preguntan los ciclistas desde la app · contesta y les llega un aviso'],ann:['Aviso general','Mensaje para todos los usuarios'],eth:['Ética y sanciones','Código ético, avisos, suspensiones y expulsiones'],news:['Novedades','Anuncia lo nuevo y las próximas actualizaciones'],mnt:['Copias y restaurar','Copia de seguridad, restauración y mantenimiento']}[view];
  $('vTitle').textContent=T[0];$('vSub').textContent=T[1]+' · datos de las '+new Date(loadedAt).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  ({res:vRes,clubs:vClubs,users:vUsers,rides:vRides,cont:vCont,rep:vRep,sup:vSup,ann:vAnn,mnt:vMnt,eth:vEth,news:vNews})[view]();
}

/* ---------- Gráfica de barras (una serie) con tooltip ---------- */
const CH={};
function barChart(id,vals,labels,color,unit){
  CH[id]={vals,labels,unit};
  const W=600,H=200,pl=30,pr=6,pt=12,pb=26,n=vals.length,mx=Math.max(1,...vals);
  const step=Math.ceil(mx/4)||1,top=step*4,bw=(W-pl-pr)/n,gap=2;
  let g='';for(let k=0;k<=4;k++){const y=pt+(H-pt-pb)*(1-k/4);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#1F3350" stroke-width="1"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#6F8199">${step*k}</text>`}
  let b='';vals.forEach((v,i)=>{const h=(H-pt-pb)*(v/top),x=pl+i*bw+gap/2,y=H-pb-h,w=Math.max(1,bw-gap);
    if(v>0)b+=`<path d="M${x},${H-pb}V${y+Math.min(4,h)}Q${x},${y} ${x+Math.min(4,w/2)},${y}H${x+w-Math.min(4,w/2)}Q${x+w},${y} ${x+w},${y+Math.min(4,h)}V${H-pb}Z" fill="${color}"/>`;
    b+=`<rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent" data-c="${esc(id)}" data-i="${esc(i)}"/>`;
    if(i%5===0||i===n-1)b+=`<text x="${pl+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="#6F8199">${labels[i].slice(8)}/${labels[i].slice(5,7)}</text>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Gráfica de barras">${g}<line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="#2A4468"/>${b}</svg></div>`;
}

async function clubRole(id,field){

async function roleToggle(id,field,k){
  const g=D.groups.find(x=>x.id===id);const on=!!(g[field]||{})[k];
  try{await db.collection('groups').doc(id).update({[field+'.'+k]:on?FV.delete():g.members[k]});g[field]=g[field]||{};if(on)delete g[field][k];else g[field][k]=g.members[k];toast(on?'Cargo quitado':'Cargo asignado');clubRole(id,field);if(view==='clubs')vClubs()}catch(e){err(e)}

async function clubDelete(id){

/* v4.4 — Cambiar el nombre de un ciclista en TODOS los sitios (su ficha, club, salidas, ranking, actividad y puntos). Su móvil lo recibe solo. */
async function userRename(id){
  const u=D.users.find(x=>x.id===id);if(!u)return;
  const v=prompt('Nombre real de este ciclista:',u.name||'');if(v===null)return;
  const n=v.replace(/[<>]/g,'').replace(/\s+/g,' ').trim().slice(0,30);
  if(n.length<2){toast('Escribe un nombre de al menos 2 letras');return}
  if(n===u.name){toast('Es el mismo nombre');return}
  toast('Cambiando el nombre…');let k=0;const W=async(ref,data)=>{try{await ref.update(data);k++}catch(e){console.warn(e)}};
  try{await db.collection('users').doc(id).set({name:n},{merge:true});k++}catch(e){err(e);return}
  for(const g of D.groups){const up={};
    if(g.members&&g.members[id]!==undefined)up['members.'+id]=n;
    if(g.admins&&g.admins[id]!==undefined)up['admins.'+id]=n;
    if(g.captains&&g.captains[id]!==undefined)up['captains.'+id]=n;
    if(g.byUid===id)up.by=n;
    Object.entries(g.grupetas||{}).forEach(([gid,gp])=>{if(gp&&gp.resp&&gp.resp[id]!==undefined)up['grupetas.'+gid+'.resp.'+id]=n});
    if(Object.keys(up).length)await W(db.collection('groups').doc(g.id),up)}
  for(const r of D.rides){const up={};if(r.people&&r.people[id]!==undefined)up['people.'+id]=n;if(r.byUid===id)up.by=n;if(Object.keys(up).length)await W(db.collection('rides').doc(r.id),up)}
  for(const r of D.rank){if(r.s&&r.s[id])await W(db.collection('rank').doc(r.id),{['s.'+id+'.n']:n})}
  for(const f of D.feed.filter(x=>x.uid===id))await W(db.collection('feed').doc(f.id),{name:n});
  for(const c of ['routes','pois'])for(const d of D[c].filter(x=>x.uid===id&&x.by!==undefined))await W(db.collection(c).doc(d.id),{by:n});
  if(D.nearby&&D.nearby.some(x=>x.id===id))await W(db.collection('nearby').doc(id),{name:n});
  toast('✅ Ahora se llama «'+n+'» ('+k+' sitios actualizados)');loadAll();
}
/* v4.4 — Eliminar ciclistas de la lista (p. ej. nombres de prueba): ficha, contenido y rastro en clubes, salidas y ranking */
async function userPurge(id){
  const u=D.users.find(x=>x.id===id)||{};let k=0;const DEL=async ref=>{try{await ref.delete();k++}catch(e){console.warn(e)}};const UP=async(ref,data)=>{try{await ref.update(data);k++}catch(e){console.warn(e)}};
  for(const c of ['feed','routes','pois'])for(const d of D[c].filter(x=>x.uid===id))await DEL(db.collection(c).doc(d.id));
  for(const r of D.rides){if(r.byUid===id){await DEL(db.collection('rides').doc(r.id));continue}if(r.people&&r.people[id]!==undefined)await UP(db.collection('rides').doc(r.id),{['people.'+id]:FV.delete()})}
  for(const g of D.groups){if(g.byUid===id)continue;const up={};
    ['members','admins','captains'].forEach(f=>{if(g[f]&&g[f][id]!==undefined)up[f+'.'+id]=FV.delete()});
    if(g.gm&&g.gm[id]!==undefined)up['gm.'+id]=FV.delete();

const ser=v=>{if(v&&typeof v.toMillis==='function')return{__ts:v.toMillis()};if(Array.isArray(v))return v.map(ser);if(v&&typeof v==='object'){const o={};for(const k in v)o[k]=ser(v[k]);return o}return v};
const des=v=>{if(v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length===1&&typeof v.__ts==='number')return TS.fromMillis(v.__ts);if(Array.isArray(v))return v.map(des);if(v&&typeof v==='object'){const o={};for(const k in v)o[k]=des(v[k]);return o}return v};
async function backup(){
  toast('Preparando la copia…');const out={app:'RideSafe IA',kind:'backup',version:1,createdAt:Date.now(),collections:{}};
  for(const c of BK){try{const s=await db.collection(c).limit(20000).get();out.collections[c]={};s.docs.forEach(d=>out.collections[c][d.id]=ser(d.data()))}catch(e){console.warn(c,e)}}
  const n=Object.values(out.collections).reduce((a,c)=>a+Object.keys(c).length,0);
  const d=new Date();download(`ridesafe-copia-${iso(d)}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.json`,JSON.stringify(out),'application/json');
  toast(`💾 Copia descargada (${nf(n)} documentos)`);
}
let RS=null;
function restorePick(f){
  if(!f)return;const rd=new FileReader();
  rd.onload=()=>{let j;try{j=JSON.parse(rd.result)}catch(e){toast('Ese archivo no es una copia válida');return}
    if(!j||j.app!=='RideSafe IA'||j.kind!=='backup'||!j.collections){toast('Ese archivo no es una copia de RideSafe IA');return}
    RS=j;const cols=Object.keys(j.collections).filter(c=>BK.includes(c));
    dlg(`<h3>♻️ Restaurar copia<button class="x" onclick="closeDlg()">✕</button></h3><p>Copia del <b>${new Date(j.createdAt).toLocaleString('es-ES')}</b>. Marca lo que quieres restaurar:</p>
     ${cols.map(c=>`<label class="opt"><input type="checkbox" class="rsC" value="${c}" ${c==='reports'?'':'checked'}> <span style="flex:1">${esc({users:'👥 Ciclistas',groups:'🏅 Clubes y grupetas',rides:'📅 Salidas',feed:'📰 Actividad',routes:'🗺️ Rutas',pois:'☕ Puntos ciclistas',rank:'🏆 Rankings',reports:'⚠️ Reportes',config:'📣 Aviso y novedades',mod:'⚖️ Sanciones de ciclistas',sanctions:'🗂️ Historial de sanciones'}[c]||c)}</span><span class="pill mut">${nf(Object.keys(j.collections[c]).length)}</span></label>`).join('')}
     <p style="margin-top:10px">Escribe <b>RESTAURAR</b> para confirmar:</p><input class="inp" id="rsOk" style="width:100%" autocomplete="off">
     <div class="row"><button class="btn" onclick="closeDlg()">Cancelar</button><button class="btn lime" onclick="restoreRun()">♻️ Restaurar</button></div>`);
  };rd.readAsText(f);$('rsFile').value='';
}
async function restoreRun(){
  if($('rsOk').value.trim().toUpperCase()!=='RESTAURAR'){toast('Escribe RESTAURAR para confirmar');return}
  const cols=[...document.querySelectorAll('.rsC:checked')].map(i=>i.value);if(!cols.length){toast('Marca algo para restaurar');return}
  const jobs=[];cols.forEach(c=>Object.entries(RS.collections[c]).forEach(([id,d])=>jobs.push([c,id,d])));
  const bar=progress('Restaurando '+nf(jobs.length)+' documentos…');let ok=0,ko=0;
  for(let i=0;i<jobs.length;i+=400){const b=db.batch();jobs.slice(i,i+400).forEach(([c,id,d])=>b.set(db.collection(c).doc(id),des(d)));try{await b.commit();ok+=Math.min(400,jobs.length-i)}catch(e){console.warn(e);ko+=Math.min(400,jobs.length-i)}bar((i+400)/jobs.length)}
  closeDlg();toast(ko?`Restaurados ${nf(ok)} · fallaron ${nf(ko)}`:`♻️ Restaurados ${nf(ok)} documentos`);loadAll();
}
async function migrate(){
  if(!await confirmDlg('🔧 Pasar datos antiguos a su club','Las salidas, rutas, puntos ciclistas y actividad sin club se asignarán al club de quien los creó. Lo de ciclistas sin club se queda como está.','Asignar',false))return;
  const clubOf={};D.groups.forEach(g=>Object.keys(g.members||{}).forEach(k=>{if(!clubOf[k])clubOf[k]=g.id}));
  let n=0;for(const r of D.rides.filter(r=>!r.group&&clubOf[r.byUid])){try{await db.collection('rides').doc(r.id).update({group:clubOf[r.byUid]});n++}catch(e){}}
  for(const c of ['feed','routes','pois'])for(const x of D[c].filter(x=>!x.club&&clubOf[x.uid])){try{await db.collection(c).doc(x.id).update({club:clubOf[x.uid]});n++}catch(e){}}
  toast(`✅ ${n} datos asignados a su club`);loadAll();
}


/* ---------- ⚖️ Ética y sanciones ---------- */
const ETICA=[
 ['🚦','Respetar las normas de circulación'],['🤝','Nadie se queda atrás'],['🛡️','La seguridad del grupo primero'],['🗣️','Respeto a las personas'],
 ['🌿','Respeto al entorno'],['📊','Juego limpio'],['📵','Uso correcto de la app'],['🔒','Privacidad']];
const LV_U=[['warn','⚠️ Aviso','Le sale un aviso en la app. Puede seguir usándola.'],['s7','⏸️ Suspensión 7 días','No puede publicar, apuntarse ni entrar en clubes durante 7 días.'],['s30','⏸️ Suspensión 30 días','Igual, durante 30 días.'],['exp','🚫 Expulsión','Fuera de la app: se le saca de todos sus clubes y no puede volver a entrar.']];
const LV_C=[['warn','⚠️ Aviso al club','Los administradores del club ven el aviso.'],['susp','⛔ Suspender club','Nadie del club puede ver ni usar sus datos hasta que lo levantes.']];
const modOf=id=>D.mod.find(m=>m.id===id)||null;
const isSan=id=>{const m=modOf(id);return !!(m&&m.banned&&(!m.until||m.until>Date.now()))};
function userState(id,u){const m=modOf(id);
  if(isSan(id))return m.expelled||!m.until?'<span class="pill bad">🚫 Expulsado</span>':`<span class="pill bad">⏸️ Hasta ${fDate(m.until)}</span>`;
  if(u&&u.banned)return '<span class="pill bad">🚫 Bloqueado</span>';
  if(m&&m.warn&&m.warn.t)return `<span class="pill warn">⚠️ Avisado</span>`;return '<span class="pill ok">Activo</span>'}
function activeSan(){return [...D.users.filter(u=>isSan(u.id)||u.banned).map(u=>({kind:'user',id:u.id,name:u.name})),...D.groups.filter(g=>g.suspended).map(g=>({kind:'club',id:g.id,name:g.name}))]}
function sanForm(title,lv,withWipe){
  return `<h3>${title}<button class="x" onclick="closeDlg()">✕</button></h3>
   <p style="margin-bottom:6px"><b>Motivo (código ético)</b></p><select class="inp" id="snR" style="width:100%">${ETICA.map(([e,t])=>`<option>${e} ${t}</option>`).join('')}<option>Otro</option></select>
   <p style="margin:12px 0 6px"><b>Medida</b></p>${lv.map(([k,t,d],i)=>`<label class="opt"><input type="radio" name="snL" value="${k}" ${i?'':'checked'}><span style="flex:1">${t}<br><small style="color:var(--txt3);font-weight:500">${d}</small></span></label>`).join('')}
   <p style="margin:12px 0 6px"><b>Explicación</b> <small style="color:var(--txt3)">(la verá el afectado)</small></p><textarea class="inp" id="snN" rows="3" maxlength="200" style="width:100%" placeholder="Ej. Conducción peligrosa en la salida del domingo"></textarea>
   ${withWipe?'<label class="opt" style="margin-top:10px"><input type="checkbox" id="snW"> <span>Si es expulsión, borrar también sus salidas, rutas, actividad y puntos</span></label>':''}
   <div class="row"><button class="btn" onclick="closeDlg()">Cancelar</button><button class="btn red" id="snGo">⚖️ Aplicar sanción</button></div>`;
}
async function logSan(o){try{await db.collection('sanctions').add({...o,t:Date.now()})}catch(e){console.warn(e)}}
function sanctionUser(id){
  const u=D.users.find(x=>x.id===id);if(!u)return;const club=userClub(id);
  dlg(sanForm('⚖️ Sancionar a '+esc(u.name),LV_U,true));
  $('snGo').onclick=async()=>{
    const reason=$('snR').value,note=$('snN').value.trim().slice(0,200),lv=document.querySelector('input[name=snL]:checked').value,now=Date.now(),wipe=!!($('snW')&&$('snW').checked);
    if(lv==='exp'&&!await confirmDlg('🚫 Expulsar de RideSafe IA',`${esc(u.name)} saldrá de todos sus clubes y no podrá volver a publicar ni entrar en ninguno. Puedes levantarlo más adelante.`,'Expulsar',true))return;
    try{
      const ref=db.collection('mod').doc(id);
      if(lv==='warn')await ref.set({warn:{reason,note,t:now}},{merge:true});
      if(lv==='s7'||lv==='s30')await ref.set({banned:true,until:now+(lv==='s7'?7:30)*86400000,expelled:false,reason,note,t:now},{merge:true});
      if(lv==='exp'){
        await ref.set({banned:true,until:0,expelled:true,reason,note,t:now},{merge:true});
        for(const g of D.groups.filter(g=>(g.members||{})[id])){const up={['members.'+id]:FV.delete(),['gm.'+id]:FV.delete()};if((g.admins||{})[id])up['admins.'+id]=FV.delete();if((g.captains||{})[id])up['captains.'+id]=FV.delete();try{await db.collection('groups').doc(g.id).update(up)}catch(e){console.warn(e)}}
        await db.collection('users').doc(id).set({group:null},{merge:true}).catch(()=>{});
        if(wipe){for(const c of ['feed','routes','pois'])for(const d of D[c].filter(x=>x.uid===id))await db.collection(c).doc(d.id).delete().catch(()=>{});for(const r of D.rides.filter(x=>x.byUid===id))await db.collection('rides').doc(r.id).delete().catch(()=>{})}
      }
      await logSan({kind:'user',targetId:id,name:u.name,club:club?club.name:'',reason,note,level:LV_U.find(x=>x[0]===lv)[1]});
      closeDlg();toast('⚖️ Sanción aplicada a '+u.name);loadAll();
    }catch(e){err(e)}
  };
}
async function liftUser(id){
  const u=D.users.find(x=>x.id===id);if(!await confirmDlg('✓ Levantar sanción',`${esc(u.name)} podrá volver a usar la app con normalidad (tendrá que volver a entrar en su club con el código).`,'Levantar',false))return;
  try{await db.collection('mod').doc(id).set({banned:false,until:0,expelled:false,warn:FV.delete()},{merge:true});if(u.banned)await db.collection('users').doc(id).set({banned:false},{merge:true});
    await logSan({kind:'user',targetId:id,name:u.name,club:(userClub(id)||{}).name||'',reason:'—',note:'',level:'✓ Sanción levantada'});toast('Sanción levantada');loadAll()}catch(e){err(e)}
}
function sanctionClub(id){
  const g=D.groups.find(x=>x.id===id);if(!g)return;
  dlg(sanForm('⚖️ Sancionar al club '+esc(g.name),LV_C,false)+'<p style="margin-top:10px;font-size:13px">Para eliminarlo del todo usa 🗑️ en la lista de clubes.</p>');
  $('snGo').onclick=async()=>{
    const reason=$('snR').value,note=$('snN').value.trim().slice(0,200),lv=document.querySelector('input[name=snL]:checked').value,now=Date.now();
    try{
      if(lv==='warn')await db.collection('groups').doc(id).update({warn:{reason,note,t:now}});
      if(lv==='susp')await db.collection('groups').doc(id).update({suspended:true,suspendReason:reason,suspendNote:note,suspendT:now});
      await logSan({kind:'club',targetId:id,name:g.name,club:g.name,reason,note,level:LV_C.find(x=>x[0]===lv)[1]});
      closeDlg();toast('⚖️ Sanción aplicada al club');loadAll();
    }catch(e){err(e)}
  };
}
async function liftClub(id){
  const g=D.groups.find(x=>x.id===id);if(!await confirmDlg('✓ Levantar sanción del club',`«${esc(g.name)}» vuelve a funcionar con normalidad y se quita el aviso.`,'Levantar',false))return;
  try{await db.collection('groups').doc(id).update({suspended:false,suspendReason:FV.delete(),suspendNote:FV.delete(),warn:FV.delete()});
    await logSan({kind:'club',targetId:id,name:g.name,club:g.name,reason:'—',note:'',level:'✓ Sanción levantada'});toast('Sanción levantada');loadAll()}catch(e){err(e)}
}
function vEth(){
  const act=activeSan();const hist=D.sanctions.slice().sort((a,b)=>(b.t||0)-(a.t||0));
  $('view').innerHTML=`<div class="grid2">
   <div class="box"><h3>📜 Código ético del ciclista</h3><div class="d">Lo ven todos los usuarios en la app (Perfil → Ayuda). Es la base de cada sanción.</div>
    ${ETICA.map(([e,t])=>`<div class="opt" style="cursor:default">${e} ${t}</div>`).join('')}</div>
   <div class="box"><h3>⛔ Sanciones activas (${act.length})</h3><div class="d">Ciclistas suspendidos o expulsados y clubes suspendidos</div>
    ${act.length?act.map(x=>`<div class="opt" style="cursor:default"><span style="flex:1">${x.kind==='club'?'🏅':'👤'} ${esc(x.name)}<br><small style="color:var(--txt3)">${x.kind==='club'?'Club suspendido':userState(x.id,D.users.find(u=>u.id===x.id)).replace(/<[^>]+>/g,'')}</small></span><button class="btn sm" onclick="${x.kind==='club'?'liftClub':'liftUser'}(${jsq(x.id)})">✓ Levantar</button></div>`).join(''):'<div class="empty">✅ Ninguna sanción activa</div>'}
    <p style="color:var(--txt3);font-size:12.5px;margin-top:10px">Para sancionar: ve a <b>Ciclistas</b> o <b>Clubes</b> y pulsa ⚖️ Sancionar.</p></div>
   </div>
   <div class="box tw"><h3>🗂️ Historial de sanciones</h3><div class="d">Todo queda registrado: quién, cuándo, por qué y qué medida</div>
    <table class="tbl"><thead><tr><th>Fecha</th><th>A quién</th><th class="hide-m">Motivo</th><th>Medida</th></tr></thead><tbody>
    ${hist.map(h=>`<tr><td class="num" style="white-space:nowrap">${fDate(h.t)}</td><td>${h.kind==='club'?'🏅':'👤'} <b>${esc(h.name)}</b>${h.club&&h.kind!=='club'?'<br><small style="color:var(--txt3)">'+esc(h.club)+'</small>':''}</td><td class="hide-m" style="color:var(--txt2)">${esc(h.reason)}${h.note?'<br><small>'+esc(h.note)+'</small>':''}</td><td>${esc(h.level)}</td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">Sin sanciones todavía</div></td></tr>'}
    </tbody></table></div>`;
}

/* ---------- 🚀 Novedades y próximas actualizaciones ---------- */
function vNews(){
  const l=(upd.items||[]).slice().sort((a,b)=>(b.t||0)-(a.t||0));
  $('view').innerHTML=`<div class="grid2">
   <div class="box"><h3>✍️ Nueva novedad</h3><div class="d">Aparece a todos en la app: aviso en Comunidad y en Perfil → «Novedades y próximas actualizaciones».</div>
    <div style="display:grid;grid-template-columns:110px 1fr;gap:10px"><input class="inp" id="nwV" placeholder="Versión" maxlength="10"><input class="inp" id="nwT" placeholder="Título (ej. Salidas que se repiten cada domingo)" maxlength="60"></div>
    <textarea class="inp" id="nwX" rows="3" maxlength="300" style="width:100%;margin-top:10px" placeholder="Explícalo en pocas palabras"></textarea>
    <div class="chips" id="nwS" style="margin-top:10px"><button class="chip on" data-s="soon" onclick="nwSet(this)">🚀 Próximamente</button><button class="chip" data-s="ready" onclick="nwSet(this)">✅ Ya disponible</button></div>
    <label class="opt" style="margin-top:10px;cursor:pointer"><input type="checkbox" id="nwP" checked> <span style="flex:1">📲 Avisar también al móvil de todos <small style="display:block;color:var(--txt3);font-weight:500">Notificación a quien tenga activados los avisos. Al tocarla se abre «Novedades».</small></span></label>
    <button class="btn lime" style="margin-top:12px" onclick="newsAdd()">📣 Publicar novedad</button></div>
   <div class="box"><h3>📋 Publicadas (${l.length})</h3><div class="d">Lo que ven ahora los usuarios</div>
    ${l.length?l.map(x=>`<div class="opt" style="cursor:default;align-items:flex-start"><span style="flex:1"><span class="pill ${x.status==='soon'?'warn':'ok'}">${x.status==='soon'?'Próximamente':'Ya disponible'}</span> <b>${x.v?'v'+esc(x.v)+' · ':''}${esc(x.title)}</b>${x.push?' <span title="Se avisó al móvil">📲</span>':''}<br><small style="color:var(--txt3);font-weight:500">${esc(x.text||'')}</small></span><span style="display:flex;flex-direction:column;gap:6px">${x.status==='soon'?`<button class="btn sm" onclick="newsDone(${jsq(x.id)})">✅ Ya está</button>`:''}<button class="btn sm red" onclick="newsDel(${jsq(x.id)})">🗑️</button></span></div>`).join(''):'<div class="empty">Aún no has publicado novedades</div>'}</div>
   </div>`;
}
function nwSet(b){document.querySelectorAll('#nwS .chip').forEach(c=>c.classList.toggle('on',c===b))}
async function newsSave(items){await db.collection('config').doc('updates').set({items});upd.items=items}
async function newsAdd(){
  const title=$('nwT').value.trim(),text=$('nwX').value.trim(),v=$('nwV').value.trim();if(!title){toast('Pon un título');return}
  const push=!!($('nwP')&&$('nwP').checked);
  const it={id:'n'+Date.now().toString(36),v,title,text,status:document.querySelector('#nwS .chip.on').dataset.s,t:Date.now(),...(push?{push:true}:{})};
  try{await newsSave([...(upd.items||[]),it].slice(-40));toast(push?'📣 Novedad publicada · 📲 notificación en camino':'📣 Novedad publicada');vNews()}catch(e){err(e)}
}
async function newsDone(id){const push=!!($('nwP')&&$('nwP').checked);try{await newsSave((upd.items||[]).map(x=>x.id===id?{...x,status:'ready',t:Date.now(),push}:x));toast(push?'✅ Marcada como disponible · 📲 aviso al móvil':'✅ Marcada como disponible');vNews()}catch(e){err(e)}}
async function newsDel(id){if(!await confirmDlg('🗑️ Quitar novedad','Dejará de verse en la app.','Quitar',true))return;try{await newsSave((upd.items||[]).filter(x=>x.id!==id));toast('Novedad quitada');vNews()}catch(e){err(e)}}
/* ---------- Ventanas y utilidades ---------- */
function dlg(h){$('dlg').innerHTML=h;$('ov').classList.add('show')}
function closeDlg(){$('ov').classList.remove('show')}
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeDlg()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDlg()});
function confirmDlg(t,txt,ok,danger){return new Promise(res=>{dlg(`<h3>${t}</h3><p>${txt}</p><div class="row"><button class="btn" id="cNo">Cancelar</button><button class="btn ${danger?'red':'lime'}" id="cOk">${esc(ok)}</button></div>`);$('cNo').onclick=()=>{closeDlg();res(false)};$('cOk').onclick=()=>{closeDlg();res(true)}})}
function typed(t,txt,word){return new Promise(res=>{dlg(`<h3>${t}</h3><p>${txt}</p><p>Escribe <b>${esc(word)}</b> para confirmar:</p><input class="inp" id="tyI" style="width:100%" autocomplete="off"><div class="row"><button class="btn" id="cNo">Cancelar</button><button class="btn red" id="cOk">Borrar</button></div>`);$('cNo').onclick=()=>{closeDlg();res(false)};$('cOk').onclick=()=>{if($('tyI').value.trim().toUpperCase()!==String(word).toUpperCase()){toast('No coincide');return}closeDlg();res(true)}})}
function progress(t){dlg(`<h3>${t}</h3><div class="prog"><i id="pgI"></i></div>`);return p=>{const i=$('pgI');if(i)i.style.width=Math.min(100,Math.round(p*100))+'%'}}
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function err(e){console.error(e);toast(/permission/.test(e&&e.code||'')?'Firebase no lo permite: ¿reglas v4.0 publicadas?':'No se pudo: '+(e&&(e.code||e.message)||'error'))}
</script>
</body></html>
