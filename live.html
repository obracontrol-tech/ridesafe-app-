<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideSafe IA — Seguimiento en Vivo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ font-family:'Barlow',sans-serif; background:#0a0e27; color:#fff; height:100vh; }
    #mapa{ width:100%; height:100vh; }
    #panel-info{
      position:fixed; top:0; left:0; right:0; z-index:999;
      background:linear-gradient(135deg,rgba(10,14,39,0.95) 0%,rgba(20,28,60,0.95) 100%);
      padding:12px 16px;
      border-bottom:1px solid rgba(168,230,61,0.2);
      backdrop-filter:blur(10px);
    }
    .info-row{ display:flex; justify-content:space-between; align-items:center; margin:6px 0; font-size:14px; }
    .info-label{ color:#a8e63d; font-weight:600; }
    .info-valor{ color:#fff; }
    .estado-ok{ color:#4ade80; }
    .punto-ciclista{
      width:24px; height:24px; border-radius:50%;
      background:#4ade80; border:3px solid #fff;
      box-shadow:0 0 15px rgba(74,222,128,0.8), 0 0 30px rgba(74,222,128,0.4);
      animation:latido 1.5s infinite;
    }
    @keyframes latido{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.2); }
    }
    .info-nombre{ font-size:16px; font-weight:700; color:#a8e63d; margin-bottom:8px; }
  </style>
</head>
<body>
<div id="mapa"></div>
<div id="panel-info">
  <div class="info-nombre">🚴 Juan Manuel — Lleida</div>
  <div class="info-row">
    <span class="info-label">Estado:</span>
    <span class="info-valor estado-ok">🟢 En directo</span>
  </div>
  <div class="info-row">
    <span class="info-label">Velocidad:</span>
    <span class="info-valor" id="velocidad">0 km/h</span>
  </div>
  <div class="info-row">
    <span class="info-label">Distancia:</span>
    <span class="info-valor" id="distancia">0 km</span>
  </div>
  <div class="info-row">
    <span class="info-label">Batería:</span>
    <span class="info-valor" id="bateria">85%</span>
  </div>
  <div class="info-row">
    <span class="info-label">Tiempo en ruta:</span>
    <span class="info-valor" id="tiempo">0 min</span>
  </div>
</div>

<script>
// Ruta simulada alrededor de Lleida (puntos de control)
var rutaCompleta = [
  {lat: 41.6175, lng: -0.6298},  // Centro
  {lat: 41.6280, lng: -0.6150},  // NE
  {lat: 41.6350, lng: -0.5900},  // E
  {lat: 41.6300, lng: -0.5600},  // SE
  {lat: 41.6100, lng: -0.5500},  // S
  {lat: 41.5950, lng: -0.5700},  // SW
  {lat: 41.5900, lng: -0.6150},  // W
  {lat: 41.6000, lng: -0.6400},  // NW
  {lat: 41.6175, lng: -0.6298}   // Vuelta al inicio
];

var mapa = null;
var marcador = null;
var posicionProgreso = 0;  // De 0 a 1 en la ruta completa
var velocidadSimulada = 24;
var distanciaTotal = 0;
var tiempoInicio = Date.now();
var bateriaSimulada = 85;

// Interpolación lineal entre dos puntos
function interpolarPunto(p1, p2, t) {
  return {
    lat: p1.lat + (p2.lat - p1.lat) * t,
    lng: p1.lng + (p2.lng - p1.lng) * t
  };
}

// Obtener posición actual en la ruta (interpolada)
function obtenerPosicionActual() {
  var totalSegmentos = rutaCompleta.length - 1;
  var segmento = Math.floor(posicionProgreso * totalSegmentos);
  var progresosegmento = (posicionProgreso * totalSegmentos) - segmento;
  
  if (segmento >= rutaCompleta.length - 1) {
    return rutaCompleta[rutaCompleta.length - 1];
  }
  
  return interpolarPunto(
    rutaCompleta[segmento],
    rutaCompleta[segmento + 1],
    progresosegmento
  );
}

function inicializarMapa() {
  mapa = L.map('mapa').setView([41.6175, -0.6298], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(mapa);
  
  // Dibujar la ruta completa
  var latlngs = rutaCompleta.map(p => [p.lat, p.lng]);
  L.polyline(latlngs, {color: '#a8e63d', weight: 3, opacity: 0.6}).addTo(mapa);
  
  // Crear marcador
  var pos = obtenerPosicionActual();
  marcador = L.marker([pos.lat, pos.lng], {
    icon: L.divIcon({
      className: 'punto-ciclista',
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    })
  }).addTo(mapa);
}

function actualizarPosicion() {
  // Avanzar en la ruta (velocidad variable, entre 20 y 30 km/h)
  var velocidadBase = 22 + Math.sin(Date.now() / 5000) * 5;
  var incremento = (velocidadBase / 1000) * 0.1;  // Pequeño incremento cada 100ms
  posicionProgreso += incremento;
  
  // Si completa la ruta, reiniciar
  if (posicionProgreso >= 1) {
    posicionProgreso = 0;
  }
  
  var pos = obtenerPosicionActual();
  marcador.setLatLng([pos.lat, pos.lng]);
  
  // Actualizar distancia (cada 0.001 unidades = ~0.1 km)
  distanciaTotal += 0.001 * 100;
  
  // Velocidad realista
  velocidadSimulada = velocidadBase;
  
  // Batería decrementando
  bateriaSimulada = Math.max(10, 85 - (posicionProgreso * 40));
  
  // Tiempo en ruta
  var tiempoMs = Date.now() - tiempoInicio;
  var tiempoMin = Math.floor(tiempoMs / 60000);
  
  // Actualizar UI
  document.getElementById('velocidad').textContent = velocidadSimulada.toFixed(1) + ' km/h';
  document.getElementById('distancia').textContent = distanciaTotal.toFixed(1) + ' km';
  document.getElementById('bateria').textContent = bateriaSimulada.toFixed(0) + '%';
  document.getElementById('tiempo').textContent = tiempoMin + ' min';
}

// Iniciar
document.addEventListener('DOMContentLoaded', function(){
  inicializarMapa();
  
  // Actualizar cada 100ms para movimiento suave
  setInterval(actualizarPosicion, 100);
});
</script>
</body>
</html>
