<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideSafe IA — Seguimiento en Vivo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ font-family:'Barlow',sans-serif; background:#0a0e27; color:#fff; height:100vh; }
    #mapa{ width:100%; height:100vh; }
    #panel-info{
      position:fixed; top:0; left:0; right:0; z-index:999;
      background:linear-gradient(135deg,rgba(10,14,39,0.95) 0%,rgba(20,28,60,0.95) 100%);
      padding:12px 16px;
      border-bottom:1px solid rgba(168,230,61,0.2);
      backdrop-filter:blur(10px);
    }
    .info-row{ display:flex; justify-content:space-between; align-items:center; margin:6px 0; font-size:14px; }
    .info-label{ color:#a8e63d; font-weight:600; }
    .info-valor{ color:#fff; }
    .estado-ok{ color:#4ade80; }
    .estado-offline{ color:#ff6b6b; animation:parpadeo 1s infinite; }
    @keyframes parpadeo{ 0%,100%{opacity:1} 50%{opacity:0.3} }
    .punto-ciclista{
      width:24px; height:24px; border-radius:50%;
      background:#4ade80; border:3px solid #fff;
      box-shadow:0 0 15px rgba(74,222,128,0.8), 0 0 30px rgba(74,222,128,0.4);
      animation:latido 1.5s infinite;
    }
    .punto-offline{
      background:#ff6b6b;
      box-shadow:0 0 15px rgba(255,107,107,0.8);
    }
    @keyframes latido{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.2); }
    }
    .info-nombre{ font-size:16px; font-weight:700; color:#a8e63d; margin-bottom:8px; }
  </style>
</head>
<body>
<div id="mapa"></div>
<div id="panel-info">
  <div class="info-nombre" id="nombre-ciclista">Esperando datos...</div>
  <div class="info-row">
    <span class="info-label">Estado:</span>
    <span class="info-valor" id="estado">⏳ Conectando...</span>
  </div>
  <div class="info-row">
    <span class="info-label">Velocidad:</span>
    <span class="info-valor" id="velocidad">-- km/h</span>
  </div>
  <div class="info-row">
    <span class="info-label">Distancia:</span>
    <span class="info-valor" id="distancia">-- km</span>
  </div>
  <div class="info-row">
    <span class="info-label">Batería:</span>
    <span class="info-valor" id="bateria">--</span>
  </div>
  <div class="info-row">
    <span class="info-label">Tiempo en ruta:</span>
    <span class="info-valor" id="tiempo">-- min</span>
  </div>
</div>

<script>
// Firebase Config
var firebaseConfig = {
  apiKey: 'AIzaSyDlaR4dgVtBMa4B4aY6l10_O4xBNgJvNJQ',
  authDomain: 'ridesafe-app-25ecb.firebaseapp.com',
  databaseURL: 'https://ridesafe-app-25ecb-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'ridesafe-app-25ecb',
  storageBucket: 'ridesafe-app-25ecb.firebasestorage.app',
  messagingSenderId: '322135466974',
  appId: '1:322135466974:web:28b4586375bfd6211bf34f'
};

if (!firebase.apps || !firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
var db = firebase.database();

var liveId = null;
var mapa = null;
var marcador = null;
var tiempoInicio = null;

function obtenerIdURL(){
  var params = new URLSearchParams(window.location.search);
  return params.get('id');
}

function inicializarMapa(){
  mapa = L.map('mapa').setView([41.6175, -0.6298], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(mapa);
}

function verificarSenal(timestamp){
  var ahora = Date.now();
  var difMs = ahora - timestamp;
  var difMin = Math.floor(difMs / 60000);
  return {
    minutos: difMin,
    online: difMin < 3
  };
}

function calcularTiempoRuta(){
  if (!tiempoInicio) return 0;
  var ms = Date.now() - tiempoInicio;
  return Math.floor(ms / 60000);
}

function actualizarMarcador(lat, lng, en_linea) {
  if (!mapa) inicializarMapa();
  
  if (marcador) {
    marcador.setLatLng([lat, lng]);
  } else {
    marcador = L.marker([lat, lng], {
      icon: L.divIcon({
        className: 'punto-ciclista' + (en_linea ? '' : ' punto-offline'),
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      })
    }).addTo(mapa);
  }
  
  mapa.setView([lat, lng], 15);
}

function escucharRideLive(id){
  db.ref('ride_live/' + id).on('value', function(snap){
    var datos = snap.val();
    
    if (!datos) {
      document.getElementById('estado').innerHTML = '🔴 Sesión finalizada';
      document.getElementById('estado').className = 'info-valor estado-offline';
      document.getElementById('nombre-ciclista').textContent = 'Sesión no encontrada';
      return;
    }
    
    if (!tiempoInicio) {
      tiempoInicio = datos.ts;
    }
    
    var { lat, lng, vel, dist, bat, nombre, ts } = datos;
    var { minutos, online } = verificarSenal(ts);
    
    document.getElementById('nombre-ciclista').textContent = nombre || 'Ciclista';
    document.getElementById('velocidad').textContent = (vel || 0).toFixed(1) + ' km/h';
    document.getElementById('distancia').textContent = (dist || 0).toFixed(1) + ' km';
    document.getElementById('bateria').textContent = (bat || '--') + '%';
    document.getElementById('tiempo').textContent = calcularTiempoRuta() + ' min';
    
    if (online) {
      document.getElementById('estado').innerHTML = '🟢 En directo';
      document.getElementById('estado').className = 'info-valor estado-ok';
    } else {
      document.getElementById('estado').innerHTML = '🔴 Sin señal (' + minutos + ' min)';
      document.getElementById('estado').className = 'info-valor estado-offline';
    }
    
    actualizarMarcador(lat, lng, online);
  });
}

document.addEventListener('DOMContentLoaded', function(){
  liveId = obtenerIdURL();
  
  if (!liveId) {
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0e27;color:#ff6b6b;font-size:18px;text-align:center;padding:20px;">❌ ID de sesión no válido<br><br>Presiona el botón 📡 Ride Live en la app para obtener un enlace</div>';
    return;
  }
  
  inicializarMapa();
  escucharRideLive(liveId);
});
</script>
</body>
</html>
