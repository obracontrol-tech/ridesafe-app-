<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideSafe IA — Seguimiento en Vivo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ font-family:'Barlow',sans-serif; background:#0a0e27; color:#fff; height:100vh; }
    #mapa{ width:100%; height:100vh; }
    #panel-info{
      position:fixed; top:0; left:0; right:0; z-index:999;
      background:linear-gradient(135deg,rgba(10,14,39,0.95) 0%,rgba(20,28,60,0.95) 100%);
      padding:12px 16px;
      border-bottom:1px solid rgba(168,230,61,0.2);
      backdrop-filter:blur(10px);
    }
    .info-row{ display:flex; justify-content:space-between; align-items:center; margin:6px 0; font-size:14px; }
    .info-label{ color:#a8e63d; font-weight:600; }
    .info-valor{ color:#fff; }
    .estado-ok{ color:#4ade80; }
    .estado-offline{ color:#ff6b6b; }
    .punto-ciclista{
      width:24px; height:24px; border-radius:50%;
      background:#4ade80; border:3px solid #fff;
      box-shadow:0 0 15px rgba(74,222,128,0.8), 0 0 30px rgba(74,222,128,0.4);
      animation:latido 1.5s infinite;
    }
    @keyframes latido{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.2); }
    }
    .info-nombre{ font-size:16px; font-weight:700; color:#a8e63d; margin-bottom:8px; }
  </style>
</head>
<body>
<div id="mapa"></div>
<div id="panel-info">
  <div class="info-nombre">🚴 Juan Manuel — Lleida</div>
  <div class="info-row">
    <span class="info-label">Estado:</span>
    <span class="info-valor estado-ok">🟢 En directo</span>
  </div>
  <div class="info-row">
    <span class="info-label">Velocidad:</span>
    <span class="info-valor" id="velocidad">0 km/h</span>
  </div>
  <div class="info-row">
    <span class="info-label">Distancia:</span>
    <span class="info-valor" id="distancia">0 km</span>
  </div>
  <div class="info-row">
    <span class="info-label">Batería:</span>
    <span class="info-valor" id="bateria">85%</span>
  </div>
  <div class="info-row">
    <span class="info-label">Tiempo en ruta:</span>
    <span class="info-valor" id="tiempo">0 min</span>
  </div>
</div>

<script>
// Coordenadas base: Lleida
var lledaBase = {lat: 41.6175, lng: -0.6298};

// Ruta simulada (recorrido circular alrededor de Lleida)
var rutaSimulada = [
  {lat: 41.6175, lng: -0.6298},  // Centro Lleida
  {lat: 41.6250, lng: -0.6200},  // Norte
  {lat: 41.6300, lng: -0.6100},  
  {lat: 41.6320, lng: -0.5950},  
  {lat: 41.6300, lng: -0.5800},  // Este
  {lat: 41.6200, lng: -0.5900},
  {lat: 41.6100, lng: -0.6000},
  {lat: 41.6050, lng: -0.6150},
  {lat: 41.6075, lng: -0.6350},  // Oeste
  {lat: 41.6150, lng: -0.6400},
  {lat: 41.6175, lng: -0.6298}   // Vuelta al inicio
];

var mapa = null;
var marcador = null;
var posicionActual = 0;
var velocidadSimulada = 24;
var distanciaTotal = 0;
var tiempoInicio = Date.now();
var bateriaSimulada = 85;

function inicializarMapa(){
  mapa = L.map('mapa').setView([lledaBase.lat, lledaBase.lng], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(mapa);
  
  // Dibujar la ruta completa
  var latlngs = rutaSimulada.map(p => [p.lat, p.lng]);
  L.polyline(latlngs, {color: '#a8e63d', weight: 3, opacity: 0.6}).addTo(mapa);
  
  // Crear marcador inicial
  marcador = L.marker([lledaBase.lat, lledaBase.lng], {
    icon: L.divIcon({
      className: 'punto-ciclista',
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    })
  }).addTo(mapa);
}

function actualizarPosicion(){
  if (posicionActual >= rutaSimulada.length) {
    posicionActual = 0;
  }
  
  var pos = rutaSimulada[posicionActual];
  marcador.setLatLng([pos.lat, pos.lng]);
  mapa.setView([pos.lat, pos.lng], 15);
  
  // Calcular distancia aproximada (0.1 km por paso)
  distanciaTotal += 0.1;
  
  // Velocidad variable (entre 18 y 32 km/h)
  velocidadSimulada = 18 + Math.sin(posicionActual * 0.5) * 7 + Math.random() * 4;
  
  // Batería decrementando lentamente
  bateriaSimulada = Math.max(10, 85 - (posicionActual * 0.8));
  
  // Tiempo en ruta (en minutos)
  var tiempoMs = Date.now() - tiempoInicio;
  var tiempoMin = Math.floor(tiempoMs / 60000);
  
  // Actualizar UI
  document.getElementById('velocidad').textContent = velocidadSimulada.toFixed(1) + ' km/h';
  document.getElementById('distancia').textContent = distanciaTotal.toFixed(1) + ' km';
  document.getElementById('bateria').textContent = bateriaSimulada.toFixed(0) + '%';
  document.getElementById('tiempo').textContent = tiempoMin + ' min';
  
  posicionActual++;
}

// Iniciar
document.addEventListener('DOMContentLoaded', function(){
  inicializarMapa();
  
  // Actualizar posición cada 5 segundos
  setInterval(actualizarPosicion, 5000);
  
  // Actualizar inmediatamente
  actualizarPosicion();
});
</script>
</body>
</html>
