<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideSafe IA — Seguimiento en Vivo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ font-family:'Barlow',sans-serif; background:#0a0e27; color:#fff; }
    #mapa{ width:100%; height:100vh; }
    #panel-info{
      position:fixed; top:0; left:0; right:0; z-index:999;
      background:linear-gradient(135deg,rgba(10,14,39,0.95) 0%,rgba(20,28,60,0.95) 100%);
      padding:12px 16px;
      border-bottom:1px solid rgba(168,230,61,0.2);
      backdrop-filter:blur(10px);
    }
    .info-row{ display:flex; justify-content:space-between; align-items:center; margin:6px 0; font-size:14px; }
    .info-label{ color:#a8e63d; font-weight:600; }
    .info-valor{ color:#fff; }
    .estado-ok{ color:#4ade80; }
    .estado-offline{ color:#ff6b6b; animation:parpadeo 1s infinite; }
    @keyframes parpadeo{ 0%,100%{opacity:1} 50%{opacity:0.3} }
    .punto-ciclista{
      width:24px; height:24px; border-radius:50%;
      background:#4ade80; border:3px solid #fff;
      box-shadow:0 0 15px rgba(74,222,128,0.8), 0 0 30px rgba(74,222,128,0.4);
      animation:latido 1.5s infinite;
    }
    .punto-offline{
      background:#ff6b6b;
      box-shadow:0 0 15px rgba(255,107,107,0.8);
      animation:parpadeo 1s infinite;
    }
    @keyframes latido{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.2); }
    }
    .info-nombre{ font-size:16px; font-weight:700; color:#a8e63d; }
    .tiempo-offline{ color:#ff8833; font-weight:600; }
  </style>
</head>
<body>
<div id="mapa"></div>
<div id="panel-info">
  <div class="info-nombre" id="nombre-ciclista">Ciclista</div>
  <div class="info-row">
    <span class="info-label">Estado:</span>
    <span class="info-valor estado-ok" id="estado">🟢 En directo</span>
  </div>
  <div class="info-row">
    <span class="info-label">Velocidad:</span>
    <span class="info-valor" id="velocidad">0 km/h</span>
  </div>
  <div class="info-row">
    <span class="info-label">Distancia:</span>
    <span class="info-valor" id="distancia">0 km</span>
  </div>
  <div class="info-row">
    <span class="info-label">Batería:</span>
    <span class="info-valor" id="bateria">--</span>
  </div>
  <div class="info-row">
    <span class="info-label">Tiempo en ruta:</span>
    <span class="info-valor" id="tiempo">0 min</span>
  </div>
</div>

<script>
// Firebase Config — MISMA QUE EN app.html
var firebaseConfig = {
  apiKey: "AIzaSyDLmfKg23BxkFOAYTVrfmiAQm93HcPRTWQ",
  authDomain: "ridesafe-app-25ecb.firebaseapp.com",
  databaseURL: "https://ridesafe-app-25ecb.europe-west1.firebasedatabase.app",
  projectId: "ridesafe-app-25ecb",
  storageBucket: "ridesafe-app-25ecb.appspot.com",
  messagingSenderId: "723275706844",
  appId: "1:723275706844:web:f66f6c7e8cdc2c0ee5b2a4"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();

// Variables globales
var liveId = null;
var mapa = null;
var marcador = null;
var ultimoTimestamp = null;
var tiempoInicio = null;
var ultimaPosicion = null;

// Obtener el ID de la URL
function obtenerIdURL(){
  var params = new URLSearchParams(window.location.search);
  return params.get('id');
}

// Inicializar mapa
function inicializarMapa(){
  mapa = L.map('mapa').setView([41.3851, 2.1734], 13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© CartoDB',
    maxZoom: 19
  }).addTo(mapa);
}

// Función para actualizar el marcador
function actualizarMarcador(lat, lng, en_linea) {
  if (!mapa) inicializarMapa();
  
  if (marcador) {
    marcador.setLatLng([lat, lng]);
  } else {
    marcador = L.marker([lat, lng], {
      icon: L.divIcon({
        className: 'punto-ciclista' + (en_linea ? '' : ' punto-offline'),
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      })
    }).addTo(mapa);
  }
  
  // Actualizar clase según estado
  var divMarcador = marcador.getElement();
  if (divMarcador) {
    if (en_linea) {
      divMarcador.querySelector('.punto-ciclista').classList.remove('punto-offline');
    } else {
      divMarcador.querySelector('.punto-ciclista').classList.add('punto-offline');
    }
  }
  
  mapa.setView([lat, lng], 15);
  ultimaPosicion = [lat, lng];
}

// Función para calcular tiempo sin señal
function verificarSenal(timestamp){
  var ahora = Date.now();
  var difMs = ahora - timestamp;
  var difMin = Math.floor(difMs / 60000);
  
  return {
    minutos: difMin,
    online: difMin < 3
  };
}

// Función para calcular tiempo en ruta
function calcularTiempoRuta(){
  if (!tiempoInicio) return 0;
  var ms = Date.now() - tiempoInicio;
  return Math.floor(ms / 60000); // Retorna minutos
}

// Escuchar cambios en Firebase
function escucharRideLive(id){
  db.ref('ride_live/' + id).on('value', function(snap){
    var datos = snap.val();
    
    if (!datos) {
      document.getElementById('estado').innerHTML = '🔴 Sesión finalizada';
      document.getElementById('estado').className = 'info-valor estado-offline';
      return;
    }
    
    // Si es la primera vez, guardar timestamp de inicio
    if (!tiempoInicio) {
      tiempoInicio = datos.ts;
    }
    
    var { lat, lng, vel, dist, bat, nombre, ts } = datos;
    
    // Verificar si está en línea
    var { minutos, online } = verificarSenal(ts);
    
    // Actualizar UI
    document.getElementById('nombre-ciclista').textContent = nombre || 'Ciclista';
    document.getElementById('velocidad').textContent = (vel || 0).toFixed(1) + ' km/h';
    document.getElementById('distancia').textContent = (dist || 0).toFixed(1) + ' km';
    document.getElementById('bateria').textContent = (bat || '--') + '%';
    document.getElementById('tiempo').textContent = calcularTiempoRuta() + ' min';
    
    if (online) {
      document.getElementById('estado').innerHTML = '🟢 En directo';
      document.getElementById('estado').className = 'info-valor estado-ok';
    } else {
      document.getElementById('estado').innerHTML = '🔴 Sin señal (' + minutos + ' min)';
      document.getElementById('estado').className = 'info-valor estado-offline';
    }
    
    // Actualizar marcador en el mapa
    actualizarMarcador(lat, lng, online);
  });
}

// Iniciar
document.addEventListener('DOMContentLoaded', function(){
  liveId = obtenerIdURL();
  
  if (!liveId) {
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#ff6b6b;font-size:18px;">❌ ID de sesión no válido</div>';
    return;
  }
  
  inicializarMapa();
  escucharRideLive(liveId);
});
</script>
</body>
</html>
